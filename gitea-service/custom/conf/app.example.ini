APP_NAME = Antigravity Gitea
RUN_USER = SYSTEM
WORK_PATH = C:\Gitea
RUN_MODE = prod

[repository]
ROOT = C:\Gitea\data\gitea-repositories
DEFAULT_BRANCH = main

[database]
DB_TYPE = sqlite3
PATH = C:\Gitea\data\gitea.db

[server]
PROTOCOL = http
DOMAIN = localhost
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 3000
ROOT_URL = http://localhost:3000/
DISABLE_SSH = true
START_SSH_SERVER = false
OFFLINE_MODE = false
LFS_START_SERVER = true

[security]
INSTALL_LOCK = true
SECRET_KEY = GENERATE_A_RANDOM_SECRET_KEY_HERE
INTERNAL_TOKEN = GENERATE_A_RANDOM_JWT_TOKEN_HERE

[oauth2]
JWT_SECRET = GENERATE_A_RANDOM_JWT_SECRET_HERE

[service]
DISABLE_REGISTRATION = true
ALLOW_ONLY_EXTERNAL_REGISTRATION = false
SHOW_REGISTRATION_BUTTON = false
REQUIRE_SIGNIN_VIEW = true
REGISTER_MANUAL_CONFIRM = false
ENABLE_NOTIFY_MAIL = false

[log]
MODE = console, file
LEVEL = info
ROOT_PATH = C:\Gitea\log

[picture]
DISABLE_GRAVATAR = true
ENABLE_FEDIVERSE_AVATAR = false

[queue]
TYPE = immediate

[queue.common]
TYPE = immediate

[indexer]
ISSUE_INDEXER_TYPE = db
REPO_INDEXER_ENABLED = false

; Optional: Uncomment only when Active Directory / LDAP user synchronization is configured
; [cron.sync_external_users]
; RUN_AT_START = true
; SCHEDULE = @every 1h
; UPDATE_EXISTING = true

[git]
PATH = C:/Program Files/Git/cmd/git.exe
